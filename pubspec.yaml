name: hadith_nawawi_audio
description: "تطبيق الأربعين النووية بصوت الشيخ أحمد النفيس"

publish_to: "none"

version: 1.5.0+11

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons:
  equatable:
  flutter_bloc:
  path_provider:
  responsive_framework:
  flutter_localizations:
    sdk: flutter
  share_plus:
  # Opens WhatsApp for the feedback flow. Its platform packages were already
  # pulled in transitively by `printing`, so declaring it directly costs
  # nothing in size. The app still makes no network requests of its own —
  # this hands off to another app, exactly like the share sheet does.
  url_launcher:
  just_audio:
  shared_preferences:
  flutter_markdown: ^0.7.4+3
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  # PDF export — used by lib/services/pdf_export_service.dart for the
  # "print / save as PDF" feature. Both packages are pure-Dart with no
  # tracking and no network access; they only consume bundled assets.
  pdf: ^3.11.1
  printing: ^5.13.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # Build-time only: regenerates launcher icons from assets/images/logo.png
  # per flutter_launcher_icons.yaml. Not shipped in the app.
  flutter_launcher_icons: ^0.14.4
  flutter_lints:
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/
    - assets/fonts/
    - assets/json/
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-VariableFont_slnt,wght.ttf
        - asset: assets/fonts/static/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/static/Cairo-Light.ttf
          weight: 300
        - asset: assets/fonts/static/Cairo-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/static/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/static/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/static/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/static/Cairo-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/static/Cairo-Black.ttf
          weight: 900
          