org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
kotlin.incremental=false
kotlin.daemon.jvmargs=-Xmx512m
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.caching=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# Flutter plugin modules declare a mix of JVM targets: Flutter's own Gradle
# plugin pins some to Java 11 while others (share_plus) build at 17, and a few
# still declare Kotlin jvmTarget 1.8. Kotlin Gradle Plugin 2.x turns that
# mismatch into a hard error, and no single global value satisfies every
# plugin. Everything is dexed by D8 anyway, so downgrade the check to a
# warning rather than fighting each plugin's own configuration.
# Revisit once the plugins ship Built-in Kotlin support.
kotlin.jvm.target.validation.mode=warning
